appId: com.agenticleash.app
productName: Agentic Leash
publish:
  provider: github
  owner: velusgautam
  repo: agentic-leash
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
  - out/main/**
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: resources/icon.png
  identity: "Velu Gautam (W3M2JWPTNR)"
  hardenedRuntime: true
  notarize: true
  category: public.app-category.developer-tools
  artifactName: Agentic-Leash-${version}-${arch}-mac.${ext}
dmg:
  title: Agentic Leash
  artifactName: Agentic-Leash-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: Agentic-Leash-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  category: Development
  maintainer: Agentic Leash
  artifactName: Agentic-Leash-${version}-linux-${arch}.${ext}
deb:
  afterInstall: scripts/linux-postinstall.sh
  afterRemove: scripts/linux-postremove.sh
